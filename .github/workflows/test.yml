name: Test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm install --global @openai/codex@0.164.0
      - run: node --test test/*.test.mjs
        shell: bash
      - run: python -m unittest discover -s test -p 'test_*.py'
      - name: Windows PowerShell 5.1 integration
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        shell: powershell
        run: ./test/windows.ps1
      - name: PowerShell 7 integration
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        shell: pwsh
        run: ./test/windows.ps1
      - run: python scripts/package.py
